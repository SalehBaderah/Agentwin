name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LLM_PROVIDER: none
      DATABASE_PATH: artifacts/ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          npm --prefix frontend ci
      - name: Backend tests including MQTT fixture
        env:
          RUN_MQTT_TESTS: '1'
        run: python -m pytest -q
      - name: Frontend checks
        run: |
          npm --prefix frontend run lint
          npm --prefix frontend test
          npm --prefix frontend run build
      - name: Validate evaluation cases
        run: python -m evals.granite.run --validate-only
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser smoke on an isolated database
        shell: bash
        run: |
          mkdir -p artifacts
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 --workers 1 > artifacts/ci-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/api/health
          npm --prefix frontend run smoke
