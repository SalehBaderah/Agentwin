<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#0B0B10"/><title>Agentwin — Every system. Its own agent.</title><script>try{var p=localStorage.getItem('agentwin-theme');var t=p==='dark'||p==='light'?p:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t;document.querySelector('meta[name="theme-color"]').content=t==='dark'?'#0B0B10':'#F6F7FB'}catch(e){document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}</script></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
